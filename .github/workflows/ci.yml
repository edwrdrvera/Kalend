name: CI

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop, main]

jobs:
  lint-and-typecheck:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Install dependencies
        run: bun install

      - name: Lint
        run: bunx eslint .

      - name: Typecheck
        run: bunx tsc --noEmit

      - name: Test
        run: bun test

      - name: Review tier
        if: github.event_name == 'pull_request'
        run: |
          {
            echo '```'
            bun run review:tier origin/${{ github.base_ref }}
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
