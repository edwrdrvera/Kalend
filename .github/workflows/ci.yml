name: CI

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop, main]

jobs:
  lint-and-typecheck:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      PGHOST: localhost
      PGUSER: postgres

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Install dependencies
        run: bun install

      - name: Lint
        run: bunx eslint .

      - name: Typecheck
        run: bunx tsc --noEmit

      # The migrations expect the roles and auth.uid() that Supabase provides.
      - name: Set up test database
        run: |
          psql -v ON_ERROR_STOP=1 -q <<'SQL'
          create role anon nologin;
          create role authenticated nologin;
          create schema auth;
          create function auth.uid() returns uuid language sql stable
            as $$ select nullif(current_setting('request.jwt.claim.sub', true), '')::uuid $$;
          SQL
          for f in drizzle/[0-9]*.sql; do
            echo "apply $f"
            psql -v ON_ERROR_STOP=1 -q < "$f"
          done

      - name: Test
        run: bun test
        env:
          DATABASE_URL: postgres://postgres@localhost:5432/postgres
          SCHEMA_TEST_DATABASE_URL: postgres://postgres@localhost:5432/postgres

      - name: Review tier
        if: github.event_name == 'pull_request'
        run: |
          {
            echo '```'
            bun run review:tier origin/${{ github.base_ref }}
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
